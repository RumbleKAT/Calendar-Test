<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Vue2 Toast UI Calendar</title>
  <link rel="stylesheet" href="./node_modules/@toast-ui/calendar/dist/toastui-calendar.min.css">
  <style>
    #app { width: 100%; height: 600px; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="./node_modules/vue/dist/vue.js"></script>
  <script src="./node_modules/@toast-ui/calendar/dist/toastui-calendar.min.js"></script>
  <script src="./node_modules/@toast-ui/vue-calendar/dist/toastui-vue-calendar.js"></script>
  <script src="./validateEvent.js"></script>
  <script>
    var Calendar = tui.VueCalendar;
    new Vue({
      el: '#app',
      components: { Calendar },
      template: '<Calendar ref="calendar" :calendars="calendars" :schedules="schedules" :template="calendarTemplate" :useCreationPopup="true" style="height:600px" />',
      data: function() {
        return {
          calendars: [{ id: '1', name: 'Default', color: '#ffffff', backgroundColor: '#9e5fff' }],
          schedules: [{
            id: '1',
            calendarId: '1',
            title: 'Sample Event',
            category: 'time',
            start: new Date(),
            end: new Date(new Date().getTime() + 60 * 60 * 1000)
          }],
          calendar: null,
          calendarTemplate: {
            titlePlaceholder: '이 입력란을 작성하세요'
          }
        };
      },
      mounted: function() {
        this.calendar = this.$refs.calendar.getInstance();
        this.calendar.on('beforeCreateEvent', this.onBeforeCreateEvent);
      },
      methods: {
        onBeforeCreateEvent: function(eventData) {
          var result = validateEventData(eventData);
          if (!result.valid) {
            alert(result.message);
            return;
          }
          this.calendar.createEvents([eventData]);
        }
      }
    });
  </script>
</body>
</html>
